<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flixpedia - Apps, Games & Websites Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: #e50914;
        }
        .publish-box {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
        .publish-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .publish-btn:hover {
            background-color: #b20710;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border-left: 4px solid #e50914;
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        .card p {
            margin: 5px 0;
            font-size: 14px;
            color: #bbb;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 8px 10px;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .download-btn {
            background-color: #27ae60;
            color: white;
        }
        .download-btn:hover {
            background-color: #219653;
        }
        .visit-btn {
            background-color: #2980b9;
            color: white;
        }
        .visit-btn:hover {
            background-color: #1f618d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>flixpedia</h1>
        <p style="text-align: center; color: #aaa;">Wikipedia of the Earth & Creator Hub</p>

        <!-- Publish Form -->
        <div class="publish-box">
            <h2>Publish App, Game or Website</h2>
            <div class="form-group">
                <label for="appName">Item Name:</label>
                <input type="text" id="appName" placeholder="e.g. Rampage City">
            </div>
            <div class="form-group">
                <label for="downloadLink">Download File Link (APK / Zip):</label>
                <input type="url" id="downloadLink" placeholder="https://... (optional if only website)">
            </div>
            <div class="form-group">
                <label for="webLink">Website / Live URL Link:</label>
                <input type="url" id="webLink" placeholder="https://... (optional if only app/game)">
            </div>
            <div class="form-group">
                <label for="makerName">App Maker Name:</label>
                <input type="text" id="makerName" placeholder="SHADOWFLIX STUDIO">
            </div>
            <button class="publish-btn" onclick="publishItem()">Publish Item</button>
        </div>

        <!-- Published Items Section -->
        <h2>Published Apps, Games & Websites</h2>
        <div id="itemsGrid" class="grid">
            <!-- Dynamic items will load here -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadItems);

        function publishItem() {
            const name = document.getElementById("appName").value.trim();
            const downloadLink = document.getElementById("downloadLink").value.trim();
            const webLink = document.getElementById("webLink").value.trim();
            const maker = document.getElementById("makerName").value.trim();

            if (!name || !maker) {
                alert("Kripya Item Name aur Maker Name zaroor bhariye!");
                return;
            }

            if (!downloadLink && !webLink) {
                alert("Kripya kam se kam ek link (Download link ya Website link) zaroor dalein!");
                return;
            }

            // Check Maker Name
            if (maker !== "SHADOWFLIX STUDIO") {
                alert("Error: App Maker Name must be 'SHADOWFLIX STUDIO'!");
                return;
            }

            // Password Check
            const password = prompt("Publish karne ke liye password enter karein:");
            if (password === null) return;
            if (password !== "qwerty") {
                alert("Galat password! Item publish nahi ho sakta.");
                return;
            }

            const newItem = {
                name: name,
                downloadLink: downloadLink,
                webLink: webLink,
                maker: maker,
                date: new Date().toLocaleDateString()
            };

            let items = JSON.parse(localStorage.getItem("flixItems")) || [];
            items.push(newItem);
            localStorage.setItem("flixItems", JSON.stringify(items));

            // Reset Form
            document.getElementById("appName").value = "";
            document.getElementById("downloadLink").value = "";
            document.getElementById("webLink").value = "";
            document.getElementById("makerName").value = "";

            loadItems();
            alert("Success! Aapka item successfully publish ho gaya hai.");
        }

        function loadItems() {
            const grid = document.getElementById("itemsGrid");
            grid.innerHTML = "";

            let items = JSON.parse(localStorage.getItem("flixItems")) || [];

            if (items.length === 0) {
                grid.innerHTML = "<p style='color: #777; text-align: center; grid-column: 1/-1;'>Abhi tak koi item publish nahi hua hai.</p>";
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                
                let buttonsHTML = '<div class="btn-group">';
                if (item.downloadLink) {
                    buttonsHTML += `<a href="${escapeHtml(item.downloadLink)}" target="_blank" class="action-btn download-btn">Download File</a>`;
                }
                if (item.webLink) {
                    buttonsHTML += `<a href="${escapeHtml(item.webLink)}" target="_blank" class="action-btn visit-btn">Open Website</a>`;
                }
                buttonsHTML += '</div>';

                card.innerHTML = `
                    <h3>${escapeHtml(item.name)}</h3>
                    <p><strong>Maker:</strong> ${escapeHtml(item.maker)}</p>
                    <p><small>Published: ${item.date}</small></p>
                    ${buttonsHTML}
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
